<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side-by-Side Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fafafa; --surface:#fff; --text:#0a0a0a; --muted:#6b6b6b; --border:#e6e6e6;
    --tile:#f2f2f2; --pill-bg:#f2f2f2; --hover-border:#0a0a0a; --shadow:0 1px 2px rgba(0,0,0,.04);
  }
  :root[data-theme="dark"] {
    --bg:#0a0a0a; --surface:#141414; --text:#f5f5f5; --muted:#9a9a9a; --border:#2a2a2a;
    --tile:#1f1f1f; --pill-bg:#1f1f1f; --hover-border:#f5f5f5; --shadow:none;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; display:flex; flex-direction:column; font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--bg); color:var(--text);
    line-height:1.5; -webkit-font-smoothing:antialiased; transition:background .2s,color .2s; }
  button, textarea { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--text); outline-offset:2px; }

  .bar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 24px; background:var(--surface); border-bottom:1px solid var(--border); flex:none; }
  .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .back { color:var(--muted); text-decoration:none; font-size:.85rem; font-weight:500; white-space:nowrap; }
  .back:hover { color:var(--text); }
  .logo { width:32px; height:32px; border-radius:8px; background:var(--text); color:var(--bg); display:grid; place-items:center; font-size:15px; flex:none; }
  h1 { margin:0; font-size:1.1rem; font-weight:700; letter-spacing:-.01em; white-space:nowrap; }
  .pill { display:inline-block; font-size:.72rem; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--pill-bg); color:var(--muted); white-space:nowrap; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:7px 13px; font-size:.82rem; font-weight:500; background:var(--surface); border:1px solid var(--border); border-radius:999px; cursor:pointer; box-shadow:var(--shadow); transition:border-color .15s; white-space:nowrap; }
  .btn:hover { border-color:var(--hover-border); }
  .btn[aria-pressed="true"] { background:var(--text); color:var(--bg); border-color:var(--text); }
  .btn.icon { width:40px; height:40px; padding:0; justify-content:center; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); display:inline-block; }
  .btn[aria-pressed="true"] .dot { background:var(--bg); }

  .ws { flex:1; min-height:0; display:grid; grid-template-columns:var(--l,1fr) 12px var(--r,1fr); padding:16px 24px 24px; }
  .pane { display:flex; flex-direction:column; min-height:0; min-width:0; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; }
  .ph { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 14px; border-bottom:1px solid var(--border); }
  .ph b { font-size:.9rem; font-weight:700; margin-right:auto; }
  .ph label { display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--muted); cursor:pointer; }
  .ph input[type=checkbox] { accent-color:var(--text); }
  textarea { flex:1; min-height:0; width:100%; resize:none; border:0; padding:16px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.88rem; line-height:1.6; background:transparent; }
  textarea:focus { outline:none; }
  .stats { display:flex; flex-wrap:wrap; gap:6px; padding:10px 14px; border-top:1px solid var(--border); background:var(--bg); }
  .st { font-size:.74rem; color:var(--muted); background:var(--tile); border-radius:8px; padding:3px 9px; }
  .st b { color:var(--text); font-weight:700; }
  .div { cursor:col-resize; display:grid; place-items:center; touch-action:none; }
  .div::after { content:''; width:4px; height:44px; border-radius:4px; background:var(--border); transition:background .15s; }
  .div:hover::after, .div.on::after { background:var(--muted); }

  @media (max-width:820px) {
    .bar { padding:12px 16px; }
    .back span { display:none; }
    .ws { grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) minmax(0,1fr); gap:12px; padding:12px 16px 16px; }
    .div { display:none; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>

<header class="bar">
  <div class="brand">
    <a class="back" href="index.html">← <span>Tools Hub</span></a>
    <div class="logo" aria-hidden="true">⇄</div>
    <h1>Side-by-Side Editor</h1>
    <span class="pill">Tech Tools</span>
  </div>
  <button class="btn icon" id="themeBtn" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
    <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg id="iconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<div class="ws" id="ws">
  <section class="pane" aria-label="Source">
    <div class="ph">
      <b>Source</b>
      <label><input type="checkbox" id="keep"> Keep line breaks</label>
      <button class="btn" id="clearL" type="button">Clear</button>
    </div>
    <textarea id="L" aria-label="Source text" placeholder="Paste here. HTML is stripped automatically."></textarea>
    <div class="stats" id="sL"></div>
  </section>

  <div class="div" id="div" role="separator" aria-orientation="vertical" aria-label="Resize panes" title="Drag to resize, double-click to reset"></div>

  <section class="pane" aria-label="Working copy">
    <div class="ph">
      <b>Working copy</b>
      <button class="btn" id="sync" type="button" aria-pressed="false"><i class="dot"></i> Sync scroll</button>
      <button class="btn" id="copyR" type="button">Copy</button>
      <button class="btn" id="clearR" type="button">Clear</button>
    </div>
    <textarea id="R" aria-label="Working copy text" placeholder="Write or edit here while you read the source."></textarea>
    <div class="stats" id="sR"></div>
  </section>
</div>

<script>
var $ = function (id) { return document.getElementById(id); };
var L = $('L'), R = $('R'), MAX = 50000;

/* ---------- Cleaning ---------- */
function strip(raw, keep) {
  var t = document.createElement('div');
  t.innerHTML = raw;
  if (keep) {
    t.querySelectorAll('br').forEach(function (b) { b.replaceWith('\n'); });
    t.querySelectorAll('p,div,li,h1,h2,h3,h4,h5,h6,tr').forEach(function (e) { e.insertAdjacentText('afterend', '\n'); });
  }
  return (t.textContent || '').replace(/\n{3,}/g, '\n\n').replace(/[ \t]+\n/g, '\n').trim();
}

/* ---------- Stats ---------- */
function stats(txt, el, base) {
  var w = (txt.trim().match(/\S+/g) || []).length;
  var s = (txt.match(/[^.!?]+[.!?]+(\s|$)/g) || []).length || (txt.trim() ? 1 : 0);
  var p = txt.trim() ? txt.trim().split(/\n\s*\n/).length : 0;
  var rt = w ? (w < 200 ? '<1 min' : Math.round(w / 200) + ' min') : '0 min';
  var items = [['Characters', txt.length.toLocaleString()], ['Words', w.toLocaleString()], ['Sentences', s], ['Paragraphs', p], ['Read time', rt]];
  if (base != null) { var d = txt.length - base; items.push(['vs source', (d > 0 ? '+' : '') + d.toLocaleString()]); }
  el.innerHTML = '';
  items.forEach(function (x) {
    var sp = document.createElement('span'); sp.className = 'st';
    sp.appendChild(document.createTextNode(x[0] + ' '));
    var b = document.createElement('b'); b.textContent = x[1]; sp.appendChild(b); el.appendChild(sp);
  });
}
function save() { try { localStorage.setItem('sbs-L', L.value); localStorage.setItem('sbs-R', R.value); } catch (e) {} }
function refresh() {
  if (L.value.length > MAX) L.value = L.value.slice(0, MAX);
  stats(L.value, $('sL')); stats(R.value, $('sR'), L.value.length); save();
}

/* ---------- Paste on the left cleans only the pasted chunk ---------- */
L.addEventListener('paste', function (e) {
  e.preventDefault();
  var cd = e.clipboardData || window.clipboardData;
  var raw = cd.getData('text/html') || cd.getData('text');
  var c = strip(raw, $('keep').checked), a = L.selectionStart, b = L.selectionEnd;
  L.value = L.value.slice(0, a) + c + L.value.slice(b);
  var pos = Math.min(a + c.length, MAX);
  refresh(); L.setSelectionRange(pos, pos);
});
L.addEventListener('input', refresh);
R.addEventListener('input', refresh);

/* ---------- Buttons ---------- */
/* Two-step confirm: native confirm() is blocked in sandboxed previews */
function disarm(btn) { clearTimeout(btn._t); btn._t = null; if (btn._o) btn.textContent = btn._o; }
function armed(btn, text, fn) {
  if (btn._t) { disarm(btn); fn(); return; }
  btn._o = btn.textContent; btn.textContent = text;
  btn._t = setTimeout(function () { disarm(btn); }, 3000);
}
$('clearL').onclick = function () { armed(this, 'Click again to clear', function () { L.value = ''; refresh(); }); };
$('clearR').onclick = function () { armed(this, 'Click again to clear', function () { R.value = ''; refresh(); }); };
$('copyR').onclick = function () {
  var b = this; if (!navigator.clipboard) return;
  navigator.clipboard.writeText(R.value).then(function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy'; }, 1200); }, function () {});
};
$('keep').addEventListener('change', function () { try { localStorage.setItem('sbs-keep', this.checked); } catch (e) {} });

/* ---------- Scroll sync (proportional, off by default) ---------- */
var syncOn = false, lock = false;
function link(from, to) {
  from.addEventListener('scroll', function () {
    if (!syncOn || lock) return; lock = true;
    var f = from.scrollHeight - from.clientHeight, t = to.scrollHeight - to.clientHeight;
    to.scrollTop = f > 0 ? from.scrollTop / f * t : 0;
    requestAnimationFrame(function () { lock = false; });
  });
}
link(L, R); link(R, L);
$('sync').onclick = function () {
  syncOn = !syncOn; this.setAttribute('aria-pressed', syncOn ? 'true' : 'false');
  try { localStorage.setItem('sbs-sync', syncOn); } catch (e) {}
};

/* ---------- Draggable divider (desktop) ---------- */
var ws = $('ws'), dv = $('div');
function setSplit(x) { x = Math.max(.2, Math.min(.8, x)); ws.style.setProperty('--l', x + 'fr'); ws.style.setProperty('--r', (1 - x) + 'fr'); return x; }
dv.addEventListener('pointerdown', function (e) {
  dv.setPointerCapture(e.pointerId); dv.classList.add('on');
  var x = .5;
  function mv(ev) { var r = ws.getBoundingClientRect(); x = setSplit((ev.clientX - r.left - 24) / (r.width - 48)); }
  function up() {
    dv.classList.remove('on'); dv.removeEventListener('pointermove', mv); dv.removeEventListener('pointerup', up);
    try { localStorage.setItem('sbs-split', x); } catch (e) {}
  }
  dv.addEventListener('pointermove', mv); dv.addEventListener('pointerup', up);
});
dv.addEventListener('dblclick', function () {
  ws.style.removeProperty('--l'); ws.style.removeProperty('--r');
  try { localStorage.removeItem('sbs-split'); } catch (e) {}
});

/* ---------- Restore ---------- */
try {
  L.value = localStorage.getItem('sbs-L') || ''; R.value = localStorage.getItem('sbs-R') || '';
  $('keep').checked = localStorage.getItem('sbs-keep') === 'true';
  if (localStorage.getItem('sbs-sync') === 'true') { syncOn = true; $('sync').setAttribute('aria-pressed', 'true'); }
  var sp = parseFloat(localStorage.getItem('sbs-split')); if (sp) setSplit(sp);
} catch (e) {}
refresh();

/* ---------- Theme (same key as Tools Hub) ---------- */
var root = document.documentElement, tbtn = $('themeBtn');
function applyTheme(mode) {
  var dark = mode === 'dark';
  if (dark) root.setAttribute('data-theme', 'dark'); else root.removeAttribute('data-theme');
  $('iconMoon').style.display = dark ? 'none' : '';
  $('iconSun').style.display = dark ? '' : 'none';
  var l = dark ? 'Switch to light mode' : 'Switch to dark mode';
  tbtn.setAttribute('aria-label', l); tbtn.title = l;
}
var saved = 'light';
try { saved = localStorage.getItem('hub-theme') || 'light'; } catch (e) {}
applyTheme(saved);
tbtn.addEventListener('click', function () {
  var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('hub-theme', next); } catch (e) {}
});
</script>
</body>
</html>
