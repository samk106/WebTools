<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trello JSON Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg:#fafafa; --surface:#fff; --text:#0a0a0a; --muted:#6b6b6b; --border:#e6e6e6;
    --tile:#f2f2f2; --pill-bg:#f2f2f2; --hover-border:#0a0a0a; --shadow:0 1px 2px rgba(0,0,0,.04); --mark:#fff2a8;
  }
  :root[data-theme="dark"] {
    --bg:#0a0a0a; --surface:#141414; --text:#f5f5f5; --muted:#9a9a9a; --border:#2a2a2a;
    --tile:#1f1f1f; --pill-bg:#1f1f1f; --hover-border:#f5f5f5; --shadow:none; --mark:#5c4b00;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--bg); color:var(--text);
    line-height:1.5; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; transition:background .2s,color .2s; }
  button { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--text); outline-offset:2px; }

  .bar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 24px; background:var(--surface); border-bottom:1px solid var(--border); flex:none; }
  .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .back { color:var(--muted); text-decoration:none; font-size:.85rem; font-weight:500; white-space:nowrap; }
  .back:hover { color:var(--text); }
  .logo { width:32px; height:32px; border-radius:8px; background:var(--text); color:var(--bg); display:grid; place-items:center; font-size:15px; flex:none; }
  h1 { margin:0; font-size:1.1rem; font-weight:700; letter-spacing:-.01em; white-space:nowrap; }
  .pill { display:inline-block; font-size:.72rem; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--pill-bg); color:var(--muted); white-space:nowrap; }
  .actions { display:flex; gap:8px; }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:8px 14px; font-size:.85rem; font-weight:500; background:var(--surface); border:1px solid var(--border); border-radius:999px; cursor:pointer; box-shadow:var(--shadow); transition:border-color .15s; white-space:nowrap; }
  .btn:hover { border-color:var(--hover-border); }
  .btn[hidden] { display:none; }
  .btn[aria-pressed="true"] { background:var(--text); color:var(--bg); }
  .btn.icon { width:40px; height:40px; padding:0; justify-content:center; }

  #empty { flex:1; display:grid; place-items:center; padding:24px; }
  #empty[hidden], #app[hidden] { display:none; }
  .drop { display:block; width:100%; margin:0 auto; max-width:520px; text-align:center; padding:48px 32px; background:var(--surface); border:2px dashed var(--border); border-radius:16px; cursor:pointer; transition:border-color .15s; }
  .drop:hover, .drop.over { border-color:var(--hover-border); }
  .drop .icon { width:52px; height:52px; margin:0 auto 16px; display:grid; place-items:center; font-size:1.6rem; background:var(--tile); border-radius:12px; }
  .drop h2 { margin:0 0 6px; font-size:1.25rem; font-weight:700; letter-spacing:-.01em; }
  .drop p { margin:0; color:var(--muted); font-size:.9rem; }
  .drop .pill { margin-top:18px; }
  #err { margin:16px auto 0; max-width:520px; padding:12px 16px; border:1px solid var(--border); border-left:3px solid var(--text); border-radius:12px; background:var(--surface); font-size:.9rem; }
  #err[hidden] { display:none; }

  input[type=search] { width:100%; padding:9px 14px; font:inherit; font-size:.88rem; color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:999px; }
  input[type=search]:focus { outline:none; border-color:var(--hover-border); }
  .none { padding:16px; color:var(--muted); font-size:.88rem; }
  .placeholder { margin:auto; color:var(--muted); text-align:center; padding:48px 0; }

  /* Cards */
  .msg { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 18px; box-shadow:var(--shadow); }
  .msg-top { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .msg-top:empty { display:none; }
  .pill.over { background:var(--text); color:var(--bg); }
  .copy { margin-left:auto; padding:3px 10px; font-size:.75rem; font-weight:500; background:transparent; border:1px solid var(--border); border-radius:999px; cursor:pointer; opacity:.75; }
  .copy:hover { opacity:1; border-color:currentColor; }
  .ct { margin:0 0 8px; font-size:1rem; font-weight:600; letter-spacing:-.01em; overflow-wrap:anywhere; }
  .labels { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .lab { display:inline-flex; align-items:center; gap:6px; color:var(--text); }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .body { font-size:.92rem; overflow-wrap:anywhere; }
  .body > :first-child { margin-top:0; } .body > :last-child { margin-bottom:0; }
  .body pre { background:var(--tile); padding:12px; border-radius:12px; overflow-x:auto; font-size:.84rem; }
  .body code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.88em; }
  .body :not(pre) > code { background:var(--tile); padding:2px 6px; border-radius:6px; }
  .body table { border-collapse:collapse; display:block; overflow-x:auto; }
  .body th,.body td { border:1px solid var(--border); padding:6px 10px; }
  .body blockquote { margin:12px 0; padding-left:14px; border-left:3px solid var(--border); color:var(--muted); }
  .body a { color:inherit; text-decoration:underline; }
  .plain { white-space:pre-wrap; }
  .chk, .cmts { margin-top:12px; padding-top:10px; border-top:1px solid var(--border); font-size:.88rem; }
  .chk-h { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .chk-i { padding:2px 0; overflow-wrap:anywhere; }
  .chk-i.is-done { color:var(--muted); text-decoration:line-through; }
  .cmt + .cmt { margin-top:10px; }
  .time { font-size:.75rem; color:var(--muted); }
  mark { background:var(--mark); color:inherit; border-radius:3px; }


  #app { flex:1; min-height:0; display:flex; flex-direction:column; }
  .toolbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 24px; background:var(--surface); border-bottom:1px solid var(--border); }
  .toolbar h2 { margin:0; font-size:1.05rem; font-weight:700; letter-spacing:-.01em; flex:1; min-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .toolbar input[type=search] { width:220px; }
  #back-list { display:none; }
  .content { flex:1; min-height:0; display:grid; grid-template-columns:320px 1fr; grid-template-rows:minmax(0,1fr); }
  #app.board .content { grid-template-columns:1fr; }
  aside { display:flex; flex-direction:column; min-height:0; background:var(--surface); border-right:1px solid var(--border); }
  .side-head { padding:16px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:10px; }
  .side-title { display:flex; align-items:center; gap:8px; font-weight:700; font-size:.95rem; }
  #list { overflow-y:auto; padding:8px; flex:1; }
  .conv { display:block; width:100%; text-align:left; padding:10px 12px; margin-bottom:4px; background:none; border:1px solid transparent; border-radius:12px; cursor:pointer; }
  .conv:hover, .conv.active { background:var(--tile); }
  .conv.active { border-color:var(--hover-border); }
  .conv .t { font-size:.9rem; font-weight:600; overflow-wrap:anywhere; }
  .conv .m { margin-top:2px; font-size:.78rem; color:var(--muted); }
  #chat { overflow-y:auto; padding:24px; min-width:0; }
  .thread { max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }

  #board { display:flex; gap:16px; padding:20px 24px; overflow-x:auto; scroll-snap-type:x proximity; min-width:0; }
  .col { flex:none; width:320px; display:flex; flex-direction:column; min-height:0; background:var(--tile); border:1px solid var(--border); border-radius:16px; scroll-snap-align:start; }
  .col-head { display:flex; align-items:center; gap:8px; padding:14px 16px 10px; }
  .col-head h3 { margin:0; flex:1; font-size:.95rem; font-weight:700; overflow-wrap:anywhere; }
  .col-head .pill { background:var(--surface); }
  .col-body { flex:1; min-height:0; overflow-y:auto; padding:0 10px 10px; display:flex; flex-direction:column; gap:10px; }
  .col .msg { padding:12px 14px; }

  #app.list #board { display:none; }
  #app.board aside, #app.board #chat, #app.board #widthSeg, #app.board #menuBtn, #app.board #back-list { display:none !important; }

  .seg { display:inline-flex; padding:2px; background:var(--surface); border:1px solid var(--border); border-radius:999px; }
  .seg button { position:relative; border:0; background:none; padding:5px 12px; font-size:.8rem; font-weight:500; border-radius:999px; cursor:pointer; color:var(--muted); }
  .seg button:hover { color:var(--text); }
  .seg button[aria-pressed="true"] { background:var(--text); color:var(--bg); }
  .vt button { display:inline-flex; align-items:center; padding:6px 12px; }
  .vt button::after { content:attr(data-tip); position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%); padding:4px 9px; font-size:.72rem; font-weight:600; border-radius:8px; background:var(--text); color:var(--bg); white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .15s; z-index:60; }
  .vt button:hover::after, .vt button:focus-visible::after { opacity:1; }
  #scrim { display:none; }
  @media (min-width:761px) {
    #app.wide .thread, #app.full .thread { max-width:none; }
    #app.full .content { grid-template-columns:1fr; }
    #app.full aside { position:fixed; top:0; left:0; bottom:0; width:320px; z-index:50; transform:translateX(-100%); transition:transform .2s; }
    #app.full.drawer aside { transform:none; box-shadow:0 0 40px rgba(0,0,0,.25); }
    #app.full.drawer #scrim { display:block; position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.35); }
  }
  @media (max-width:760px) {
    #widthSeg, #menuBtn { display:none !important; }
    .toolbar { padding:12px 16px; }
    .toolbar input[type=search] { width:100%; order:5; }
    .content { grid-template-columns:1fr; }
    #app.list.reading aside { display:none; }
    #app.list:not(.reading) #chat { display:none; }
    #app.list #back-list { display:inline-flex; }
    #app.list:not(.reading) #back-list, #app.list:not(.reading) #cardSearch { display:none; }
    #app.board #back-list { display:none !important; }
    #chat { padding:16px; }
    #board { padding:16px; gap:12px; }
    .col { width:85vw; }
  }
  @media (max-width:760px) {
    .bar { padding:12px 16px; }
    .btn .label { display:none; }
    .back span { display:none; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>

<header class="bar">
  <div class="brand">
    <a class="back" href="index.html">← <span>Tools Hub</span></a>
    <div class="logo" aria-hidden="true">🗂️</div>
    <h1>Trello JSON Viewer</h1>
    <span class="pill">Tech Tools</span>
  </div>
  <div class="actions">
    <button class="btn" id="newFile" type="button" hidden>Open another file</button>
    <button class="btn icon" id="themeBtn" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
      <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg id="iconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<div id="empty">
  <div style="width:100%">
    <label class="drop" id="drop" tabindex="0">
      <div class="icon" aria-hidden="true">📂</div>
      <h2>Drop your Trello export here</h2>
      <p>or click to choose the .json file exported from your Trello board.</p>
      <span class="pill">Opens locally in your browser. Nothing is uploaded.</span>
      <input type="file" id="fileInput" accept=".json,application/json" hidden>
    </label>
    <div id="err" role="alert" hidden></div>
  </div>
</div>

<div id="app" class="list" hidden>
  <div id="scrim"></div>
  <div class="toolbar">
    <button class="btn" id="back-list" type="button">← All lists</button>
    <button class="btn" id="menuBtn" type="button" hidden>☰ Lists</button>
    <h2 id="convTitle"></h2>
    <span class="pill" id="msgCount"></span>
    <input type="search" id="cardSearch" placeholder="Search cards" aria-label="Search cards">
    <div class="seg" id="widthSeg" role="group" aria-label="Card width">
      <button type="button" data-mode="normal" aria-pressed="true">Normal</button>
      <button type="button" data-mode="wide" aria-pressed="false">Wide</button>
      <button type="button" data-mode="full" aria-pressed="false">Full</button>
    </div>
    <div class="seg vt" id="viewSeg" role="group" aria-label="View">
      <button type="button" data-view="list" data-tip="List" aria-label="List view" aria-pressed="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      </button>
      <button type="button" data-view="board" data-tip="Board" aria-label="Board view" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="4" height="15" rx="1"/></svg>
      </button>
    </div>
    <button class="btn" id="archBtn" type="button" aria-pressed="false">Show archived</button>
    <button class="btn" id="exportBtn" type="button">Export .md</button>
  </div>
  <div class="content">
    <aside>
      <div class="side-head">
        <div class="side-title">Lists <span class="pill" id="convCount"></span></div>
        <input type="search" id="listSearch" placeholder="Search lists" aria-label="Search lists">
      </div>
      <div id="list"></div>
    </aside>
    <div id="chat"><div class="thread" id="thread"></div></div>
    <div id="board"></div>
  </div>
</div>

<script>
var board = null, showArch = false, active = 'all';
var $ = function (id) { return document.getElementById(id); };
var COLORS = { green:'#61bd4f', yellow:'#f2d600', orange:'#ff9f1a', red:'#eb5a46', purple:'#c377e0', blue:'#0079bf', sky:'#00c2e0', lime:'#51e898', pink:'#ff78cb', black:'#344563' };

function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function byPos(a, b) { return (a.pos || 0) - (b.pos || 0); }
function fmtDate(d) { return d && !isNaN(d) ? d.toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' }) : ''; }

/* ---------- Loading ---------- */
function showError(msg) { var e = $('err'); e.textContent = msg; e.hidden = false; }

function loadFile(file) {
  if (!file) return;
  var r = new FileReader();
  r.onload = function () {
    try { board = normalize(JSON.parse(r.result)); }
    catch (err) {
      showError(err.message === 'shape'
        ? 'This does not look like a Trello board export. Choose the .json from Trello: Menu, Print and export, Export as JSON.'
        : 'This file is not valid JSON. Choose the original .json file from your Trello export.');
      return;
    }
    $('err').hidden = true; $('empty').hidden = true; $('app').hidden = false; $('newFile').hidden = false;
    $('app').classList.remove('reading');
    active = 'all'; $('cardSearch').value = '';
    render();
  };
  r.onerror = function () { showError('The file could not be read. Try choosing it again.'); };
  r.readAsText(file);
}

function normalize(j) {
  if (!j || !Array.isArray(j.lists) || !Array.isArray(j.cards)) throw new Error('shape');
  var chk = {}, com = {}, byId = {};
  (j.checklists || []).forEach(function (k) {
    (chk[k.idCard] = chk[k.idCard] || []).push({ name:k.name, items:(k.checkItems || []).slice().sort(byPos).map(function (i) { return { name:i.name || '', done:i.state === 'complete' }; }) });
  });
  (j.actions || []).forEach(function (a) {
    if (a.type === 'commentCard' && a.data && a.data.card)
      (com[a.data.card.id] = com[a.data.card.id] || []).push({ who:(a.memberCreator && a.memberCreator.fullName) || '', text:a.data.text || '', date:new Date(a.date) });
  });
  var lists = j.lists.slice().sort(byPos).map(function (l) { var o = { id:l.id, name:l.name || 'Untitled list', closed:!!l.closed, cards:[] }; byId[l.id] = o; return o; });
  j.cards.slice().sort(byPos).forEach(function (c) {
    var l = byId[c.idList]; if (!l) return;
    l.cards.push({
      id:c.id, name:c.name || '', desc:c.desc || '', closed:!!c.closed || false, due:c.due || null, dueComplete:!!c.dueComplete,
      labels:(c.labels || []).map(function (x) { return { name:x.name, color:x.color }; }),
      checklists:chk[c.id] || [],
      comments:(com[c.id] || []).sort(function (a, b) { return a.date - b.date; })
    });
  });
  return { name:j.name || 'Trello board', lists:lists };
}

/* ---------- Data helpers ---------- */
function visibleLists() { return board.lists.filter(function (l) { return showArch || !l.closed; }); }
function match(c, q) {
  var s = [c.name, c.desc];
  c.checklists.forEach(function (k) { k.items.forEach(function (i) { s.push(i.name); }); });
  c.comments.forEach(function (m) { s.push(m.text); });
  return s.join('\n').toLowerCase().indexOf(q.toLowerCase()) >= 0;
}
function cardsOf(l, q) { return l.cards.filter(function (c) { return (showArch || !c.closed) && (!q || match(c, q)); }); }

/* ---------- Card rendering ---------- */
function renderMd(text) { return window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(text, { breaks:true })) : null; }

function highlight(root, q) {
  var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [], n, low = q.toLowerCase();
  while ((n = w.nextNode())) nodes.push(n);
  nodes.forEach(function (node) {
    var t = node.nodeValue, i = t.toLowerCase().indexOf(low);
    if (i < 0) return;
    var frag = document.createDocumentFragment(), last = 0;
    while (i >= 0) {
      frag.appendChild(document.createTextNode(t.slice(last, i)));
      var mk = document.createElement('mark'); mk.textContent = t.slice(i, i + q.length); frag.appendChild(mk);
      last = i + q.length; i = t.toLowerCase().indexOf(low, last);
    }
    frag.appendChild(document.createTextNode(t.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
}

function dueEl(c) {
  if (!c.due) return null;
  var d = new Date(c.due), s = fmtDate(d);
  if (c.dueComplete) return el('span', 'pill', '✓ Due ' + s);
  if (d < new Date()) return el('span', 'pill over', 'Overdue · ' + s);
  return el('span', 'pill', 'Due ' + s);
}

function cardText(c) {
  var t = c.name + '\n';
  if (c.desc.trim()) t += '\n' + c.desc + '\n';
  c.checklists.forEach(function (k) { t += '\n' + (k.name || 'Checklist') + '\n'; k.items.forEach(function (i) { t += (i.done ? '[x] ' : '[ ] ') + i.name + '\n'; }); });
  return t.trim();
}

function cardEl(c, q, listName) {
  var a = el('article', 'msg'), top = el('div', 'msg-top');
  if (listName) top.appendChild(el('span', 'pill', listName));
  if (c.closed) top.appendChild(el('span', 'pill', 'Archived'));
  var d = dueEl(c); if (d) top.appendChild(d);
  var cp = el('button', 'copy', 'Copy'); cp.type = 'button';
  cp.onclick = function () {
    if (!navigator.clipboard) return;
    navigator.clipboard.writeText(cardText(c)).then(function () { cp.textContent = 'Copied'; setTimeout(function () { cp.textContent = 'Copy'; }, 1200); }, function () {});
  };
  top.appendChild(cp); a.appendChild(top);

  var t = el('h3', 'ct', c.name || 'Untitled card'); if (q) highlight(t, q); a.appendChild(t);

  if (c.labels.length) {
    var lw = el('div', 'labels');
    c.labels.forEach(function (x) {
      var p = el('span', 'pill lab'), dot = el('i', 'dot'); dot.style.background = COLORS[x.color] || '#9a9a9a';
      p.appendChild(dot); p.appendChild(document.createTextNode(x.name || x.color || 'label')); lw.appendChild(p);
    });
    a.appendChild(lw);
  }
  if (c.desc.trim()) {
    var b = el('div', 'body'), h = renderMd(c.desc);
    if (h) b.innerHTML = h; else { b.classList.add('plain'); b.textContent = c.desc; }
    if (q) highlight(b, q); a.appendChild(b);
  }
  c.checklists.forEach(function (k) {
    var done = k.items.filter(function (i) { return i.done; }).length, w = el('div', 'chk'), hd = el('div', 'chk-h');
    hd.appendChild(el('strong', '', k.name || 'Checklist')); hd.appendChild(el('span', 'pill', done + '/' + k.items.length)); w.appendChild(hd);
    k.items.forEach(function (i) { var r = el('div', 'chk-i' + (i.done ? ' is-done' : ''), (i.done ? '☑ ' : '☐ ') + i.name); if (q) highlight(r, q); w.appendChild(r); });
    a.appendChild(w);
  });
  if (c.comments.length) {
    var cw = el('div', 'cmts');
    c.comments.forEach(function (m) {
      var r = el('div', 'cmt'); r.appendChild(el('div', 'time', (m.who || 'Comment') + ' · ' + fmtDate(m.date)));
      var tx = el('div', 'plain', m.text); if (q) highlight(tx, q); r.appendChild(tx); cw.appendChild(r);
    });
    a.appendChild(cw);
  }
  return a;
}

/* ---------- Views ---------- */
var view = 'list';
function closeDrawer() { $('app').classList.remove('drawer'); }

function render() {
  if (!board) return;
  if (active !== 'all' && !visibleLists().some(function (l) { return l.id === active; })) active = 'all';
  if (view === 'board') renderBoard(); else { renderList(); renderReader(); }
}

function renderList() {
  var q = $('listSearch').value.trim().toLowerCase(), list = $('list'), ls = visibleLists(), total = 0, shown = 0;
  list.innerHTML = '';
  ls.forEach(function (l) { total += cardsOf(l, '').length; });
  function item(id, title, count) {
    var b = el('button', 'conv' + (id === active ? ' active' : '')); b.type = 'button';
    b.appendChild(el('div', 't', title)); b.appendChild(el('div', 'm', count + (count === 1 ? ' card' : ' cards')));
    b.onclick = function () { active = id; $('cardSearch').value = ''; $('app').classList.add('reading'); closeDrawer(); render(); $('chat').scrollTop = 0; };
    list.appendChild(b); shown++;
  }
  if (!q) item('all', 'All lists', total);
  ls.forEach(function (l) { if (!q || l.name.toLowerCase().indexOf(q) >= 0) item(l.id, l.name + (l.closed ? ' (archived)' : ''), cardsOf(l, '').length); });
  if (!shown) list.appendChild(el('div', 'none', 'No lists match your search.'));
  $('convCount').textContent = String(ls.length);
}

function renderReader() {
  var q = $('cardSearch').value.trim(), thread = $('thread'), all = active === 'all', shown = 0;
  var ls = visibleLists().filter(function (l) { return all || l.id === active; });
  $('convTitle').textContent = all ? board.name : ls[0].name;
  thread.innerHTML = '';
  ls.forEach(function (l) { cardsOf(l, q).forEach(function (c) { shown++; thread.appendChild(cardEl(c, q, all ? l.name : null)); }); });
  if (!shown) thread.appendChild(el('div', 'placeholder', q ? 'No cards match your search.' : 'No cards in this list.'));
  $('msgCount').textContent = shown + (shown === 1 ? ' card' : ' cards');
}

function renderBoard() {
  var q = $('cardSearch').value.trim(), b = $('board'), n = 0;
  $('convTitle').textContent = board.name;
  b.innerHTML = '';
  visibleLists().forEach(function (l) {
    var cs = cardsOf(l, q), col = el('section', 'col'), h = el('div', 'col-head'), body = el('div', 'col-body');
    n += cs.length;
    h.appendChild(el('h3', '', l.name + (l.closed ? ' (archived)' : ''))); h.appendChild(el('span', 'pill', String(cs.length)));
    col.appendChild(h);
    if (!cs.length) body.appendChild(el('div', 'none', q ? 'No matches' : 'No cards'));
    cs.forEach(function (c) { body.appendChild(cardEl(c, q, null)); });
    col.appendChild(body); b.appendChild(col);
  });
  $('msgCount').textContent = n + (n === 1 ? ' card' : ' cards');
}

$('listSearch').addEventListener('input', renderList);
$('back-list').onclick = function () { $('app').classList.remove('reading'); };
$('menuBtn').onclick = function () { $('app').classList.add('drawer'); };
$('scrim').onclick = closeDrawer;
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });

var MODES = ['normal', 'wide', 'full'];
function setMode(m) {
  if (MODES.indexOf(m) < 0) m = 'normal';
  var app = $('app'); app.classList.remove('wide', 'full', 'drawer');
  if (m !== 'normal') app.classList.add(m);
  $('menuBtn').hidden = m !== 'full';
  document.querySelectorAll('#widthSeg button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-mode') === m ? 'true' : 'false'); });
  try { localStorage.setItem('trello-view-mode', m); } catch (e) {}
}
document.querySelectorAll('#widthSeg button').forEach(function (b) { b.addEventListener('click', function () { setMode(b.getAttribute('data-mode')); }); });

function setView(v) {
  view = v === 'board' ? 'board' : 'list';
  var app = $('app'); app.classList.remove('list', 'board', 'drawer'); app.classList.add(view);
  document.querySelectorAll('#viewSeg button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-view') === view ? 'true' : 'false'); });
  try { localStorage.setItem('trello-layout', view); } catch (e) {}
  render();
}
document.querySelectorAll('#viewSeg button').forEach(function (b) { b.addEventListener('click', function () { setView(b.getAttribute('data-view')); }); });

var savedMode = 'normal', savedView = 'list';
try { savedMode = localStorage.getItem('trello-view-mode') || 'normal'; savedView = localStorage.getItem('trello-layout') || 'list'; } catch (e) {}
setMode(savedMode);
setView(savedView);


/* ---------- Export ---------- */
function exportMd() {
  var q = $('cardSearch').value.trim(), md = '# ' + board.name + '\n';
  visibleLists().filter(function (l) { return active === 'all' || l.id === active; }).forEach(function (l) {
    md += '\n## ' + l.name + '\n';
    cardsOf(l, q).forEach(function (c) {
      md += '\n### ' + (c.name || 'Untitled card') + '\n\n';
      if (c.labels.length) md += 'Labels: ' + c.labels.map(function (x) { return x.name || x.color; }).join(', ') + '\n\n';
      if (c.due) md += 'Due: ' + fmtDate(new Date(c.due)) + (c.dueComplete ? ' (done)' : '') + '\n\n';
      if (c.desc.trim()) md += c.desc.trim() + '\n\n';
      c.checklists.forEach(function (k) { md += '**' + (k.name || 'Checklist') + '**\n\n'; k.items.forEach(function (i) { md += '- [' + (i.done ? 'x' : ' ') + '] ' + i.name + '\n'; }); md += '\n'; });
      c.comments.forEach(function (m) { md += '> ' + (m.who ? m.who + ': ' : '') + m.text.replace(/\n/g, '\n> ') + '\n\n'; });
    });
  });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([md], { type:'text/markdown' }));
  a.download = (board.name.replace(/[^\w\-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'trello-board') + '.md';
  a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
}

/* ---------- Events ---------- */
var drop = $('drop');
$('fileInput').addEventListener('change', function (e) { loadFile(e.target.files[0]); e.target.value = ''; });
drop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('fileInput').click(); } });
['dragenter', 'dragover'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
['dragleave', 'drop'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
document.addEventListener('drop', function (e) { if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });
$('newFile').onclick = function () { $('fileInput').click(); };
$('cardSearch').addEventListener('input', render);
$('archBtn').onclick = function () { showArch = !showArch; this.setAttribute('aria-pressed', showArch ? 'true' : 'false'); render(); };
$('exportBtn').onclick = exportMd;

/* ---------- Theme (same key as Tools Hub) ---------- */
var root = document.documentElement, tbtn = $('themeBtn');
function applyTheme(mode) {
  var dark = mode === 'dark';
  if (dark) root.setAttribute('data-theme', 'dark'); else root.removeAttribute('data-theme');
  $('iconMoon').style.display = dark ? 'none' : '';
  $('iconSun').style.display = dark ? '' : 'none';
  var label = dark ? 'Switch to light mode' : 'Switch to dark mode';
  tbtn.setAttribute('aria-label', label); tbtn.title = label;
}
var saved = 'light';
try { saved = localStorage.getItem('hub-theme') || 'light'; } catch (e) {}
applyTheme(saved);
tbtn.addEventListener('click', function () {
  var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('hub-theme', next); } catch (e) {}
});
</script>
</body>
</html>
