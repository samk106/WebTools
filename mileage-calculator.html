<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mileage Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fafafa; --surface:#fff; --text:#0a0a0a; --muted:#6b6b6b; --border:#e6e6e6;
    --tile:#f2f2f2; --pill-bg:#f2f2f2; --hover-border:#0a0a0a; --shadow:0 1px 2px rgba(0,0,0,.04);
  }
  :root[data-theme="dark"] {
    --bg:#0a0a0a; --surface:#141414; --text:#f5f5f5; --muted:#9a9a9a; --border:#2a2a2a;
    --tile:#1f1f1f; --pill-bg:#1f1f1f; --hover-border:#f5f5f5; --shadow:none;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--bg); color:var(--text);
    line-height:1.5; -webkit-font-smoothing:antialiased; transition:background .2s,color .2s; }
  button, input { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--text); outline-offset:2px; }

  .bar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 24px; background:var(--surface); border-bottom:1px solid var(--border); }
  .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .back { color:var(--muted); text-decoration:none; font-size:.85rem; font-weight:500; white-space:nowrap; }
  .back:hover { color:var(--text); }
  .logo { width:32px; height:32px; border-radius:8px; background:var(--text); color:var(--bg); display:grid; place-items:center; font-size:15px; flex:none; }
  h1 { margin:0; font-size:1.1rem; font-weight:700; letter-spacing:-.01em; white-space:nowrap; }
  .pill { display:inline-block; font-size:.72rem; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--pill-bg); color:var(--muted); white-space:nowrap; }
  .pill.best { background:var(--text); color:var(--bg); margin-left:8px; }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:8px 14px; font-size:.85rem; font-weight:500; background:var(--surface); border:1px solid var(--border); border-radius:999px; cursor:pointer; box-shadow:var(--shadow); transition:border-color .15s; white-space:nowrap; }
  .btn:hover:not(:disabled) { border-color:var(--hover-border); }
  .btn:disabled { opacity:.4; cursor:default; }
  .btn.icon { width:40px; height:40px; padding:0; justify-content:center; }

  .wrap { max-width:1040px; margin:0 auto; padding:24px; }
  .tabrow { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .tabs { display:flex; align-items:center; gap:4px; padding:3px; background:var(--surface); border:1px solid var(--border); border-radius:999px; min-width:0; }
  .pin { display:flex; gap:4px; flex:none; padding-right:4px; margin-right:1px; border-right:1px solid var(--border); }
  .scroll { display:flex; gap:4px; min-width:0; overflow-x:auto; scrollbar-width:none; }
  .scroll::-webkit-scrollbar { display:none; }
  .tab { flex:none; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border:0; background:none; padding:7px 14px; font-size:.85rem; font-weight:500; border-radius:999px; cursor:pointer; color:var(--muted); }
  .tab:hover { color:var(--text); }
  .tab[aria-pressed="true"] { background:var(--text); color:var(--bg); }
  .tab.add { padding:7px 12px; font-weight:600; }
  .spacer { flex:1; }

  .panel { display:grid; grid-template-columns:360px 1fr; gap:16px; align-items:start; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; box-shadow:var(--shadow); }
  .form { display:flex; flex-direction:column; gap:16px; }
  .field { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .field label { font-size:.8rem; font-weight:500; color:var(--muted); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  input { width:100%; padding:10px 14px; font-size:.95rem; background:var(--bg); border:1px solid var(--border); border-radius:12px; }
  input:focus { outline:none; border-color:var(--hover-border); }
  input.err { border-color:var(--text); border-style:dashed; }
  .affix { position:relative; }
  .affix span { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
  .affix input { padding-left:30px; }
  .hint { font-size:.75rem; color:var(--muted); }

  .big-lbl { font-size:.85rem; font-weight:500; color:var(--muted); }
  .big { margin:2px 0 0; font-size:clamp(2rem,5vw,2.9rem); font-weight:800; letter-spacing:-.03em; line-height:1.1; overflow-wrap:anywhere; }
  .chips { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-top:20px; }
  .chip { background:var(--tile); border-radius:12px; padding:12px 14px; }
  .chip .k { font-size:.75rem; color:var(--muted); font-weight:500; }
  .chip .v { font-size:1.05rem; font-weight:700; letter-spacing:-.01em; overflow-wrap:anywhere; }

  details { margin-top:20px; border-top:1px solid var(--border); padding-top:14px; }
  summary { cursor:pointer; font-size:.9rem; font-weight:600; }
  .tw { overflow-x:auto; margin-top:10px; }
  table { width:100%; border-collapse:collapse; font-size:.88rem; }
  th, td { padding:8px 10px; text-align:right; border-bottom:1px solid var(--border); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { font-size:.75rem; font-weight:600; color:var(--muted); }
  tfoot td { font-weight:700; border-bottom:0; }
  tr.go { cursor:pointer; } tr.go:hover td { background:var(--tile); }
  .empty { color:var(--muted); font-size:.9rem; margin:16px 0 0; }

  @media (max-width:820px) {
    .panel { grid-template-columns:1fr; }
    .bar { padding:12px 16px; }
    .wrap { padding:16px; }
    .back span { display:none; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>

<header class="bar">
  <div class="brand">
    <a class="back" href="index.html">← <span>Tools Hub</span></a>
    <div class="logo" aria-hidden="true">⛽</div>
    <h1>Mileage Calculator</h1>
    <span class="pill">Financial Tools</span>
  </div>
  <button class="btn icon" id="themeBtn" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
    <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg id="iconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<div class="wrap">
  <div class="tabrow">
    <div class="tabs" id="tabs" role="group" aria-label="Vehicles"></div>
    <span class="spacer"></span>
    <button class="btn" id="delBtn" type="button">Delete</button>
    <button class="btn" id="clearBtn" type="button">Clear all</button>
  </div>
  <div id="view"></div>
</div>

<script>
var $ = function (id) { return document.getElementById(id); };
var KEY = 'mileage-calc-state';
var nf = new Intl.NumberFormat('en-IN', { minimumFractionDigits:2, maximumFractionDigits:2 });
var n0 = new Intl.NumberFormat('en-IN', { maximumFractionDigits:0 });
var n1 = new Intl.NumberFormat('en-IN', { maximumFractionDigits:1 });

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function mk(name) { return { id:uid(), name:name, daily:'', price:'', mileage:'', days:'30' }; }
function num(v) { var n = parseFloat(String(v).replace(/,/g, '')); return isFinite(n) && n > 0 ? n : 0; }
function inr(n) { return '₹' + nf.format(n); }
function inr0(n) { return '₹' + n0.format(n); }
function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

var S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!S || !Array.isArray(S.vs) || !S.vs.length) S = { vs:[mk('Vehicle 1')], active:null };
if (S.active !== 'all' && !S.vs.some(function (v) { return v.id === S.active; })) S.active = S.vs[0].id;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function cur() { return S.vs.filter(function (v) { return v.id === S.active; })[0]; }
function label(v, i) { return v.name.trim() || 'Vehicle ' + (i + 1); }

/* ---------- Maths ---------- */
function calc(v) {
  var daily = num(v.daily), price = num(v.price), mil = num(v.mileage), days = num(v.days) || 30;
  var perKm = mil ? price / mil : 0, litresDay = mil ? daily / mil : 0, costDay = daily * perKm;
  return { daily:daily, perKm:perKm, litresDay:litresDay, costDay:costDay, days:days,
    month:costDay * days, year:costDay * days * 12, kmMonth:daily * days, ok:perKm > 0 };
}

/* ---------- Tabs ---------- */
function renderTabs() {
  disarm($('delBtn')); disarm($('clearBtn'));
  var box = $('tabs'); box.innerHTML = '';
  var pin = el('div', 'pin'), sc = el('div', 'scroll');
  var all = el('button', 'tab all', 'All vehicles'); all.type = 'button';
  all.setAttribute('aria-pressed', S.active === 'all' ? 'true' : 'false');
  all.onclick = function () { S.active = 'all'; save(); render(); };
  pin.appendChild(all);
  var add = el('button', 'tab add', '+'); add.type = 'button'; add.title = 'Add vehicle'; add.setAttribute('aria-label', 'Add vehicle');
  add.onclick = function () { var v = mk('Vehicle ' + (S.vs.length + 1)); S.vs.push(v); S.active = v.id; save(); render(); };
  pin.appendChild(add);
  S.vs.forEach(function (v, i) {
    var b = el('button', 'tab', label(v, i)); b.type = 'button'; b.dataset.id = v.id;
    b.setAttribute('aria-pressed', v.id === S.active ? 'true' : 'false');
    b.onclick = function () { S.active = v.id; save(); render(); };
    sc.appendChild(b);
  });
  box.appendChild(pin); box.appendChild(sc);
  var on = sc.querySelector('[aria-pressed="true"]'); if (on) on.scrollIntoView({ inline:'nearest', block:'nearest' });
  $('delBtn').hidden = S.active === 'all';
  $('delBtn').disabled = S.vs.length < 2;
}
function updateTabLabel() {
  var v = cur(), t = $('tabs').querySelector('[data-id="' + v.id + '"]');
  if (t) t.textContent = label(v, S.vs.indexOf(v));
}

/* Two-step confirm: native confirm() is blocked in sandboxed previews */
function disarm(btn) { clearTimeout(btn._t); btn._t = null; if (btn._o) btn.textContent = btn._o; }
function armed(btn, text, fn) {
  if (btn._t) { disarm(btn); fn(); return; }
  btn._o = btn.textContent; btn.textContent = text;
  btn._t = setTimeout(function () { disarm(btn); }, 3000);
}
$('delBtn').onclick = function () {
  if (S.vs.length < 2) return;
  var v = cur(), i = S.vs.indexOf(v);
  armed(this, 'Click again to delete', function () {
    S.vs.splice(i, 1); S.active = S.vs[Math.min(i, S.vs.length - 1)].id; save(); render();
  });
};
$('clearBtn').onclick = function () {
  armed(this, 'Click again to clear all', function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    var v = mk('Vehicle 1'); S = { vs:[v], active:v.id }; render();
  });
};

/* ---------- Single vehicle ---------- */
function field(lbl, id) { var w = el('div', 'field'), l = el('label', '', lbl); l.htmlFor = id; w.appendChild(l); return w; }

function numInput(v, key, id, ph, affix, pattern) {
  var i = el('input'); i.id = id; i.type = 'text'; i.inputMode = 'decimal'; i.placeholder = ph; i.value = v[key];
  i.oninput = function () { v[key] = i.value; i.classList.toggle('err', /[^0-9.,\s]/.test(i.value)); save(); renderOut(); };
  if (!affix) return i;
  var a = el('div', 'affix'); a.appendChild(el('span', '', affix)); a.appendChild(i); return a;
}

function renderVehicle() {
  var v = cur(), view = $('view'); view.innerHTML = '';
  var panel = el('div', 'panel'), form = el('div', 'card form'), out = el('div', 'card'); out.id = 'out';

  var nm = field('Name', 'f-name'), ni = el('input'); ni.id = 'f-name'; ni.type = 'text'; ni.maxLength = 40; ni.value = v.name; ni.placeholder = 'e.g. Swift petrol';
  ni.oninput = function () { v.name = ni.value; save(); updateTabLabel(); };
  nm.appendChild(ni); form.appendChild(nm);

  var r1 = el('div', 'row2');
  var d = field('Daily running (km)', 'f-daily'); d.appendChild(numInput(v, 'daily', 'f-daily', '40')); r1.appendChild(d);
  var dm = field('Days used per month', 'f-days'); dm.appendChild(numInput(v, 'days', 'f-days', '30')); r1.appendChild(dm);
  form.appendChild(r1);

  var r2 = el('div', 'row2');
  var p = field('Fuel price (per litre)', 'f-price'); p.appendChild(numInput(v, 'price', 'f-price', '95', '₹')); r2.appendChild(p);
  var m = field('Mileage (km/L)', 'f-mil'); m.appendChild(numInput(v, 'mileage', 'f-mil', '18')); r2.appendChild(m);
  form.appendChild(r2);
  form.appendChild(el('div', 'hint', 'Use 22–26 days for a workday-only vehicle. Yearly figures are 12 months of this.'));

  panel.appendChild(form); panel.appendChild(out); view.appendChild(panel);
  renderOut();
}

function renderOut() {
  var v = cur(), c = calc(v), out = $('out'); out.innerHTML = '';
  out.appendChild(el('div', 'big-lbl', 'Fuel cost per month'));
  out.appendChild(el('p', 'big', inr0(c.month)));

  var chips = el('div', 'chips');
  [['Cost per km', inr(c.perKm)], ['Cost per day', inr(c.costDay)], ['Cost per year', inr0(c.year)]].forEach(function (x) {
    var ch = el('div', 'chip'); ch.appendChild(el('div', 'k', x[0])); ch.appendChild(el('div', 'v', x[1])); chips.appendChild(ch);
  });
  out.appendChild(chips);

  if (!c.ok || !c.daily) { out.appendChild(el('p', 'empty', 'Enter daily km, fuel price and mileage to see the day, week, month and year breakdown.')); return; }
  var det = el('details'); det.open = true; det.appendChild(el('summary', '', 'Breakdown'));
  var tw = el('div', 'tw'), t = el('table');
  t.innerHTML = '<thead><tr><th>Period</th><th>Distance</th><th>Fuel</th><th>Cost</th></tr></thead>';
  var tb = el('tbody');
  [['Day', 1], ['Week', 7], ['Month', c.days], ['Year', c.days * 12]].forEach(function (p) {
    var tr = el('tr');
    [p[0], n0.format(c.daily * p[1]) + ' km', n1.format(c.litresDay * p[1]) + ' L', inr0(c.costDay * p[1])].forEach(function (x) { tr.appendChild(el('td', '', x)); });
    tb.appendChild(tr);
  });
  t.appendChild(tb); tw.appendChild(t); det.appendChild(tw); out.appendChild(det);
}

/* ---------- All vehicles ---------- */
function renderAll() {
  var view = $('view'); view.innerHTML = '';
  var rows = S.vs.map(function (v, i) { return { v:v, i:i, c:calc(v) }; });
  var tM = 0, tY = 0, tK = 0, best = null;
  rows.forEach(function (r) {
    tM += r.c.month; tY += r.c.year; tK += r.c.kmMonth;
    if (r.c.ok && (!best || r.c.perKm < best.c.perKm)) best = r;
  });
  var comparable = rows.filter(function (r) { return r.c.ok; }).length > 1;

  var top = el('div', 'card');
  top.appendChild(el('div', 'big-lbl', 'Combined fuel cost per month across ' + S.vs.length + (S.vs.length === 1 ? ' vehicle' : ' vehicles')));
  top.appendChild(el('p', 'big', inr0(tM)));
  var chips = el('div', 'chips');
  [['Per year', inr0(tY)], ['Distance per month', n0.format(tK) + ' km']].forEach(function (x) {
    var ch = el('div', 'chip'); ch.appendChild(el('div', 'k', x[0])); ch.appendChild(el('div', 'v', x[1])); chips.appendChild(ch);
  });
  if (comparable) {
    var ch = el('div', 'chip'); ch.appendChild(el('div', 'k', 'Cheapest per km')); ch.appendChild(el('div', 'v', label(best.v, best.i) + ' · ' + inr(best.c.perKm))); chips.appendChild(ch);
  }
  top.appendChild(chips); view.appendChild(top);

  var card = el('div', 'card'); card.style.marginTop = '16px';
  var tw = el('div', 'tw'), t = el('table');
  t.innerHTML = '<thead><tr><th>Vehicle</th><th>Daily km</th><th>Mileage</th><th>Per km</th><th>Per month</th><th>Per year</th></tr></thead>';
  var tb = el('tbody');
  rows.forEach(function (r) {
    var tr = el('tr', 'go'); tr.tabIndex = 0; tr.title = 'Open this vehicle';
    var v = r.v, first = el('td', '', label(v, r.i));
    if (comparable && r === best) first.appendChild(el('span', 'pill best', 'Cheapest'));
    tr.appendChild(first);
    [r.c.daily ? n0.format(r.c.daily) + ' km' : '–', num(v.mileage) ? num(v.mileage) + ' km/L' : '–', r.c.ok ? inr(r.c.perKm) : '–', inr0(r.c.month), inr0(r.c.year)].forEach(function (x) { tr.appendChild(el('td', '', x)); });
    var open = function () { S.active = v.id; save(); render(); };
    tr.onclick = open; tr.onkeydown = function (e) { if (e.key === 'Enter') open(); };
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  var tf = el('tfoot'), fr = el('tr');
  ['Total', '', '', '', inr0(tM), inr0(tY)].forEach(function (x) { fr.appendChild(el('td', '', x)); });
  tf.appendChild(fr); t.appendChild(tf); tw.appendChild(t); card.appendChild(tw); view.appendChild(card);
}

function render() { renderTabs(); if (S.active === 'all') renderAll(); else renderVehicle(); }
render();

/* ---------- Theme (same key as Tools Hub) ---------- */
var root = document.documentElement, tbtn = $('themeBtn');
function applyTheme(mode) {
  var dark = mode === 'dark';
  if (dark) root.setAttribute('data-theme', 'dark'); else root.removeAttribute('data-theme');
  $('iconMoon').style.display = dark ? 'none' : '';
  $('iconSun').style.display = dark ? '' : 'none';
  var l = dark ? 'Switch to light mode' : 'Switch to dark mode';
  tbtn.setAttribute('aria-label', l); tbtn.title = l;
}
var saved = 'light';
try { saved = localStorage.getItem('hub-theme') || 'light'; } catch (e) {}
applyTheme(saved);
tbtn.addEventListener('click', function () {
  var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('hub-theme', next); } catch (e) {}
});
</script>
</body>
</html>
