<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FD Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fafafa; --surface:#fff; --text:#0a0a0a; --muted:#6b6b6b; --border:#e6e6e6;
    --tile:#f2f2f2; --pill-bg:#f2f2f2; --hover-border:#0a0a0a; --shadow:0 1px 2px rgba(0,0,0,.04);
  }
  :root[data-theme="dark"] {
    --bg:#0a0a0a; --surface:#141414; --text:#f5f5f5; --muted:#9a9a9a; --border:#2a2a2a;
    --tile:#1f1f1f; --pill-bg:#1f1f1f; --hover-border:#f5f5f5; --shadow:none;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--bg); color:var(--text);
    line-height:1.5; -webkit-font-smoothing:antialiased; transition:background .2s,color .2s; }
  button, input, select { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--text); outline-offset:2px; }

  .bar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 24px; background:var(--surface); border-bottom:1px solid var(--border); }
  .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .back { color:var(--muted); text-decoration:none; font-size:.85rem; font-weight:500; white-space:nowrap; }
  .back:hover { color:var(--text); }
  .logo { width:32px; height:32px; border-radius:8px; background:var(--text); color:var(--bg); display:grid; place-items:center; font-size:15px; flex:none; }
  h1 { margin:0; font-size:1.1rem; font-weight:700; letter-spacing:-.01em; white-space:nowrap; }
  .pill { display:inline-block; font-size:.72rem; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--pill-bg); color:var(--muted); white-space:nowrap; }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:8px 14px; font-size:.85rem; font-weight:500; background:var(--surface); border:1px solid var(--border); border-radius:999px; cursor:pointer; box-shadow:var(--shadow); transition:border-color .15s; white-space:nowrap; }
  .btn:hover:not(:disabled) { border-color:var(--hover-border); }
  .btn:disabled { opacity:.4; cursor:default; }
  .btn.icon { width:40px; height:40px; padding:0; justify-content:center; }

  .wrap { max-width:1040px; margin:0 auto; padding:24px; }

  /* Tabs */
  .tabrow { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .tabs { display:flex; align-items:center; gap:4px; padding:3px; background:var(--surface); border:1px solid var(--border); border-radius:999px; min-width:0; }
  .pin { display:flex; gap:4px; flex:none; padding-right:4px; margin-right:1px; border-right:1px solid var(--border); }
  .scroll { display:flex; gap:4px; min-width:0; overflow-x:auto; scrollbar-width:none; }
  .scroll::-webkit-scrollbar { display:none; }
  .tab { flex:none; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border:0; background:none; padding:7px 14px; font-size:.85rem; font-weight:500; border-radius:999px; cursor:pointer; color:var(--muted); }
  .tab:hover { color:var(--text); }
  .tab[aria-pressed="true"] { background:var(--text); color:var(--bg); }
  .tab.add { padding:7px 12px; font-weight:600; }
  .spacer { flex:1; }

  /* Panel */
  .panel { display:grid; grid-template-columns:360px 1fr; gap:16px; align-items:start; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; box-shadow:var(--shadow); }
  .form { display:flex; flex-direction:column; gap:16px; }
  .field { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .field label, .lbl { font-size:.8rem; font-weight:500; color:var(--muted); }
  .row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  input, select { width:100%; padding:10px 14px; font-size:.95rem; background:var(--bg); border:1px solid var(--border); border-radius:12px; }
  input:focus, select:focus { outline:none; border-color:var(--hover-border); }
  input.err { border-color:var(--text); border-style:dashed; }
  .affix { position:relative; }
  .affix span { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
  .affix input { padding-left:30px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }

  .big-lbl { font-size:.85rem; font-weight:500; color:var(--muted); }
  .big { margin:2px 0 0; font-size:clamp(2rem,5vw,2.9rem); font-weight:800; letter-spacing:-.03em; line-height:1.1; overflow-wrap:anywhere; }
  .chips { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-top:20px; }
  .chip { background:var(--tile); border-radius:12px; padding:12px 14px; }
  .chip .k { font-size:.75rem; color:var(--muted); font-weight:500; }
  .chip .v { font-size:1.05rem; font-weight:700; letter-spacing:-.01em; overflow-wrap:anywhere; }
  .split { display:flex; height:10px; margin-top:20px; border-radius:999px; overflow:hidden; background:var(--tile); }
  .split i { display:block; height:100%; transition:width .25s; }
  .split .p { background:var(--text); } .split .i { background:var(--muted); opacity:.55; }
  .legend { display:flex; gap:16px; margin-top:8px; font-size:.78rem; color:var(--muted); }
  .legend b { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }

  details { margin-top:20px; border-top:1px solid var(--border); padding-top:14px; }
  summary { cursor:pointer; font-size:.9rem; font-weight:600; }
  .tw { overflow-x:auto; margin-top:10px; }
  table { width:100%; border-collapse:collapse; font-size:.88rem; }
  th, td { padding:8px 10px; text-align:right; border-bottom:1px solid var(--border); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { font-size:.75rem; font-weight:600; color:var(--muted); }
  tfoot td { font-weight:700; border-bottom:0; }
  tr.go { cursor:pointer; } tr.go:hover td { background:var(--tile); }
  .empty { color:var(--muted); font-size:.9rem; margin:16px 0 0; }

  @media (max-width:820px) {
    .panel { grid-template-columns:1fr; }
    .bar { padding:12px 16px; }
    .wrap { padding:16px; }
    .back span { display:none; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>

<header class="bar">
  <div class="brand">
    <a class="back" href="index.html">← <span>Tools Hub</span></a>
    <div class="logo" aria-hidden="true">🏦</div>
    <h1>FD Calculator</h1>
    <span class="pill">Financial Tools</span>
  </div>
  <button class="btn icon" id="themeBtn" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
    <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg id="iconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<div class="wrap">
  <div class="tabrow">
    <div class="tabs" id="tabs" role="group" aria-label="Fixed deposits"></div>
    <span class="spacer"></span>
    <button class="btn" id="delBtn" type="button">Delete</button>
    <button class="btn" id="clearBtn" type="button">Clear all</button>
  </div>
  <div id="view"></div>
</div>

<script>
var $ = function (id) { return document.getElementById(id); };
var COMP = { 12:'Monthly', 4:'Quarterly', 2:'Half-yearly', 1:'Yearly' };
var KEY = 'fd-calc-state';
var nf = new Intl.NumberFormat('en-IN', { minimumFractionDigits:2, maximumFractionDigits:2 });
var ni = new Intl.NumberFormat('en-IN', { maximumFractionDigits:2 });

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function mk(name, o) { return Object.assign({ id:uid(), name:name, principal:'', rate:'', y:'', m:'', d:'', comp:4 }, o || {}); }
function num(v) { var n = parseFloat(String(v).replace(/,/g, '')); return isFinite(n) && n > 0 ? n : 0; }
function inr(n) { return '₹' + nf.format(n); }
function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

var S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!S || !Array.isArray(S.fds) || !S.fds.length) S = { fds:[mk('FD 1')], active:null };
S.fds.forEach(function (f) { if (!COMP[f.comp]) f.comp = 4; });
if (S.active !== 'all' && !S.fds.some(function (f) { return f.id === S.active; })) S.active = S.fds[0].id;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function cur() { return S.fds.filter(function (f) { return f.id === S.active; })[0]; }

/* ---------- Maths ---------- */
function years(f) { return num(f.y) + num(f.m) / 12 + num(f.d) / 365; }
function valueAt(f, t) { var P = num(f.principal), n = +f.comp; return P * Math.pow(1 + num(f.rate) / 100 / n, n * t); }
function calc(f) {
  var P = num(f.principal), t = years(f), n = +f.comp, r = num(f.rate) / 100;
  var total = valueAt(f, t);
  return { P:P, t:t, total:total, interest:total - P, eay:(Math.pow(1 + r / n, n) - 1) * 100 };
}
function label(f, i) { return f.name.trim() || 'FD ' + (i + 1); }

/* ---------- Tabs ---------- */
function renderTabs() {
  disarm($('delBtn')); disarm($('clearBtn'));
  var box = $('tabs'); box.innerHTML = '';
  var pin = el('div', 'pin'), sc = el('div', 'scroll');
  var all = el('button', 'tab all', 'All FDs'); all.type = 'button';
  all.setAttribute('aria-pressed', S.active === 'all' ? 'true' : 'false');
  all.onclick = function () { S.active = 'all'; save(); render(); };
  pin.appendChild(all);
  var add = el('button', 'tab add', '+'); add.type = 'button'; add.title = 'Add FD'; add.setAttribute('aria-label', 'Add FD');
  add.onclick = function () { var f = mk('FD ' + (S.fds.length + 1)); S.fds.push(f); S.active = f.id; save(); render(); };
  pin.appendChild(add);
  S.fds.forEach(function (f, i) {
    var b = el('button', 'tab', label(f, i)); b.type = 'button'; b.dataset.id = f.id;
    b.setAttribute('aria-pressed', f.id === S.active ? 'true' : 'false');
    b.onclick = function () { S.active = f.id; save(); render(); };
    sc.appendChild(b);
  });
  box.appendChild(pin); box.appendChild(sc);
  var on = sc.querySelector('[aria-pressed="true"]'); if (on) on.scrollIntoView({ inline:'nearest', block:'nearest' });
  var isAll = S.active === 'all';
  $('delBtn').hidden = isAll;
  $('delBtn').disabled = S.fds.length < 2;
}

function updateTabLabel() {
  var f = cur(), i = S.fds.indexOf(f), t = $('tabs').querySelector('[data-id="' + f.id + '"]');
  if (t) t.textContent = label(f, i);
}

/* Two-step confirm: native confirm() is blocked in sandboxed previews */
function disarm(btn) { clearTimeout(btn._t); btn._t = null; if (btn._o) btn.textContent = btn._o; }
function armed(btn, text, fn) {
  if (btn._t) { disarm(btn); fn(); return; }
  btn._o = btn.textContent; btn.textContent = text;
  btn._t = setTimeout(function () { disarm(btn); }, 3000);
}
$('delBtn').onclick = function () {
  if (S.fds.length < 2) return;
  var f = cur(), i = S.fds.indexOf(f);
  armed(this, 'Click again to delete', function () {
    S.fds.splice(i, 1); S.active = S.fds[Math.min(i, S.fds.length - 1)].id; save(); render();
  });
};
$('clearBtn').onclick = function () {
  armed(this, 'Click again to clear all', function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    var f = mk('FD 1'); S = { fds:[f], active:f.id }; render();
  });
};

/* ---------- Single FD view ---------- */
function field(lbl, id, extra) {
  var w = el('div', 'field'), l = el('label', '', lbl); l.htmlFor = id; w.appendChild(l); return w;
}

function renderFd() {
  var f = cur(), v = $('view'); v.innerHTML = '';
  var panel = el('div', 'panel'), form = el('div', 'card form'), out = el('div', 'card'); out.id = 'out';

  var nm = field('Name', 'f-name'), ni_ = el('input'); ni_.id = 'f-name'; ni_.type = 'text'; ni_.maxLength = 40; ni_.value = f.name; ni_.placeholder = 'e.g. SBI 7.1%';
  ni_.oninput = function () { f.name = ni_.value; save(); updateTabLabel(); };
  nm.appendChild(ni_); form.appendChild(nm);

  var pr = field('Principal', 'f-principal'), aff = el('div', 'affix'), pi = el('input');
  aff.appendChild(el('span', '', '₹')); pi.id = 'f-principal'; pi.type = 'text'; pi.inputMode = 'decimal'; pi.placeholder = '1,00,000'; pi.value = f.principal === '' ? '' : ni.format(num(f.principal));
  pi.oninput = function () { f.principal = pi.value; pi.classList.toggle('err', /[^0-9.,\s]/.test(pi.value)); change(); };
  pi.onblur = function () { var n = num(pi.value); f.principal = n ? String(n) : ''; pi.value = n ? ni.format(n) : ''; pi.classList.remove('err'); save(); };
  aff.appendChild(pi); pr.appendChild(aff); form.appendChild(pr);

  var row2 = el('div', 'row2');
  var rt = field('Interest rate (% per year)', 'f-rate'), ri = el('input');
  ri.id = 'f-rate'; ri.type = 'text'; ri.inputMode = 'decimal'; ri.placeholder = '7.1'; ri.value = f.rate;
  ri.oninput = function () { f.rate = ri.value; ri.classList.toggle('err', /[^0-9.\s]/.test(ri.value)); change(); };
  rt.appendChild(ri); row2.appendChild(rt);
  var cp = field('Compounding', 'f-comp'), sel = el('select'); sel.id = 'f-comp';
  [12, 4, 2, 1].forEach(function (n) { var o = el('option', '', COMP[n]); o.value = n; if (+f.comp === n) o.selected = true; sel.appendChild(o); });
  sel.onchange = function () { f.comp = +sel.value; change(); };
  cp.appendChild(sel); row2.appendChild(cp); form.appendChild(row2);

  var tl = el('div', 'field'); tl.appendChild(el('span', 'lbl', 'Tenure'));
  var row = el('div', 'row');
  [['y', 'Years'], ['m', 'Months'], ['d', 'Days']].forEach(function (p) {
    var i = el('input'); i.type = 'text'; i.inputMode = 'numeric'; i.placeholder = p[1]; i.setAttribute('aria-label', p[1]); i.value = f[p[0]];
    i.oninput = function () { f[p[0]] = i.value; i.classList.toggle('err', /[^0-9.\s]/.test(i.value)); change(); };
    row.appendChild(i);
  });
  tl.appendChild(row); form.appendChild(tl);

  panel.appendChild(form); panel.appendChild(out); v.appendChild(panel);
  renderOut();
}

function change() { save(); renderOut(); }

function renderOut() {
  var f = cur(), c = calc(f), out = $('out'); out.innerHTML = '';
  out.appendChild(el('div', 'big-lbl', 'Maturity value'));
  out.appendChild(el('p', 'big', inr(c.total)));

  var chips = el('div', 'chips');
  [['Principal', inr(c.P)], ['Interest earned', inr(c.interest)], ['Effective yearly rate', c.P && num(f.rate) ? c.eay.toFixed(2) + '%' : '–']].forEach(function (x) {
    var ch = el('div', 'chip'); ch.appendChild(el('div', 'k', x[0])); ch.appendChild(el('div', 'v', x[1])); chips.appendChild(ch);
  });
  out.appendChild(chips);

  var pp = c.total ? c.P / c.total * 100 : 100;
  var sp = el('div', 'split'), a = el('i', 'p'), b = el('i', 'i'); a.style.width = pp + '%'; b.style.width = (100 - pp) + '%';
  sp.appendChild(a); sp.appendChild(b); out.appendChild(sp);
  var lg = el('div', 'legend');
  [['p', 'Principal ' + pp.toFixed(1) + '%', 'var(--text)'], ['i', 'Interest ' + (100 - pp).toFixed(1) + '%', 'var(--muted)']].forEach(function (x) {
    var s = el('span'), d = el('b'); d.style.background = x[2]; if (x[0] === 'i') d.style.opacity = .55; s.appendChild(d); s.appendChild(document.createTextNode(x[1])); lg.appendChild(s);
  });
  out.appendChild(lg);

  if (!c.P || !c.t || !num(f.rate)) { out.appendChild(el('p', 'empty', 'Enter a principal, rate and tenure to see the year-by-year growth.')); return; }
  var det = el('details'), sm = el('summary', '', 'Year-by-year growth'), tw = el('div', 'tw'), t = el('table');
  det.appendChild(sm);
  t.innerHTML = '<thead><tr><th>Year</th><th>Opening</th><th>Interest</th><th>Closing</th></tr></thead>';
  var tb = el('tbody'), rows = Math.min(Math.ceil(c.t - 1e-9), 50), prev = c.P;
  for (var k = 1; k <= rows; k++) {
    var v = valueAt(f, Math.min(k, c.t)), tr = el('tr');
    [k + (k > c.t ? '' : ''), inr(prev), inr(v - prev), inr(v)].forEach(function (x) { tr.appendChild(el('td', '', x)); });
    tb.appendChild(tr); prev = v;
  }
  t.appendChild(tb); tw.appendChild(t); det.appendChild(tw); out.appendChild(det);
}

/* ---------- All FDs view ---------- */
function renderAll() {
  var v = $('view'); v.innerHTML = '';
  var rows = S.fds.map(function (f, i) { return { f:f, i:i, c:calc(f) }; });
  var tP = 0, tI = 0, tT = 0;
  rows.forEach(function (r) { tP += r.c.P; tI += r.c.interest; tT += r.c.total; });

  var top = el('div', 'card');
  top.appendChild(el('div', 'big-lbl', 'Combined maturity value across ' + S.fds.length + (S.fds.length === 1 ? ' FD' : ' FDs')));
  top.appendChild(el('p', 'big', inr(tT)));
  var chips = el('div', 'chips');
  [['Total principal', inr(tP)], ['Total interest', inr(tI)]].forEach(function (x) {
    var ch = el('div', 'chip'); ch.appendChild(el('div', 'k', x[0])); ch.appendChild(el('div', 'v', x[1])); chips.appendChild(ch);
  });
  top.appendChild(chips); v.appendChild(top);

  var card = el('div', 'card'); card.style.marginTop = '16px';
  var tw = el('div', 'tw'), t = el('table');
  t.innerHTML = '<thead><tr><th>FD</th><th>Principal</th><th>Rate</th><th>Tenure</th><th>Interest</th><th>Maturity</th></tr></thead>';
  var tb = el('tbody');
  rows.forEach(function (r) {
    var tr = el('tr', 'go'); tr.tabIndex = 0; tr.title = 'Open this FD';
    var f = r.f, ten = [f.y ? num(f.y) + 'y' : '', f.m ? num(f.m) + 'm' : '', f.d ? num(f.d) + 'd' : ''].filter(Boolean).join(' ') || '–';
    [label(f, r.i), inr(r.c.P), num(f.rate) ? num(f.rate) + '%' : '–', ten, inr(r.c.interest), inr(r.c.total)].forEach(function (x) { tr.appendChild(el('td', '', x)); });
    var open = function () { S.active = f.id; save(); render(); };
    tr.onclick = open; tr.onkeydown = function (e) { if (e.key === 'Enter') open(); };
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  var tf = el('tfoot'), fr = el('tr');
  ['Total', inr(tP), '', '', inr(tI), inr(tT)].forEach(function (x) { fr.appendChild(el('td', '', x)); });
  tf.appendChild(fr); t.appendChild(tf); tw.appendChild(t); card.appendChild(tw); v.appendChild(card);
}

function render() { renderTabs(); if (S.active === 'all') renderAll(); else renderFd(); }
render();

/* ---------- Theme (same key as Tools Hub) ---------- */
var root = document.documentElement, tbtn = $('themeBtn');
function applyTheme(mode) {
  var dark = mode === 'dark';
  if (dark) root.setAttribute('data-theme', 'dark'); else root.removeAttribute('data-theme');
  $('iconMoon').style.display = dark ? 'none' : '';
  $('iconSun').style.display = dark ? '' : 'none';
  var l = dark ? 'Switch to light mode' : 'Switch to dark mode';
  tbtn.setAttribute('aria-label', l); tbtn.title = l;
}
var saved = 'light';
try { saved = localStorage.getItem('hub-theme') || 'light'; } catch (e) {}
applyTheme(saved);
tbtn.addEventListener('click', function () {
  var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('hub-theme', next); } catch (e) {}
});
</script>
</body>
</html>
